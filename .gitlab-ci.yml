stages:
  - build
  - test
  - deploy

build_job:
  stage: build
  script:
    - echo "Building the project..."
    - mkdir build
    - echo "Build complete"

test_job:
  stage: test
  script:
    - echo "Running tests..."
    - echo "All tests passed"

deploy_job:
  stage: deploy
  script:
    - echo "Deploying project..."
    - echo "Deployment successful"